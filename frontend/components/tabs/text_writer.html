<div id="tab-text_writer" class="content hidden">
  
  <div style="display: grid; grid-template-columns: 360px 1fr; gap: 16px; height: calc(100vh - 120px); min-height: 650px;">
    
    <!-- LEFT PANEL: CONTROLS & PRESETS -->
    <div class="panel flex-col" style="overflow-y: auto; gap: 12px; padding: 16px;">
      <div class="panel-h justify-between items-center" style="margin-bottom: 0;">
        <span>🎬 Kinetic Text Writer</span>
        <span class="badge" style="background: rgba(0, 255, 204, 0.1); color: var(--accent-secondary, #00ffcc); border: 1px solid rgba(0, 255, 204, 0.3); font-size:10px;">TITLES PRO</span>
      </div>

      <!-- Quick Sync & Defaults -->
      <div style="background: rgba(0, 255, 204, 0.05); border: 1px solid rgba(0, 255, 204, 0.2); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px;">
        <button id="btnSyncFromWorkspace" class="btn primary text-xs" style="width: 100%; justify-content: center; font-weight: bold;">
          🔄 Sync Title Cards from Workspace (S23, S42...)
        </button>
        <div class="flex" style="gap: 6px;">
          <button id="btnApplyStyleToAll" class="btn text-xs flex-1" title="Apply active scene style to all kinetic scenes">
            🎨 Style All Titles
          </button>
          <button id="btnSetAsProjectDefault" class="btn text-xs flex-1" title="Save active style as project default for title cards">
            ⭐ Set Default Style
          </button>
        </div>
        <div class="flex flex-col" style="gap: 4px; margin-top: 2px;">
          <label class="flex items-center text-xs" style="gap: 6px; cursor: pointer; color: var(--text-main, #fff); font-size: 11px;">
            <input type="checkbox" id="kOnlyTitleCardsCheckbox" checked /> 🎯 Tik Antraščių Scenos (Black Background Cards)
          </label>
          <label class="flex items-center text-xs" style="gap: 6px; cursor: pointer; color: var(--text-main, #fff); font-size: 11px;">
            <input type="checkbox" id="syncStyleCheckbox" /> Live Auto-Sync Style to All Titles
          </label>
          <label class="flex items-center text-xs" style="gap: 6px; cursor: pointer; color: var(--accent-secondary, #00ffcc); font-size: 11px; font-weight: bold;">
            <input type="checkbox" id="kAutoFitCheckbox" checked /> 📐 Proportional Auto-Fit (Preserve Ratio)
          </label>
          <label class="flex items-center text-xs" style="gap: 6px; cursor: pointer; color: var(--muted); font-size: 11px;">
            <input type="checkbox" id="kTransparentBgCheckbox" /> 🏁 Transparent Background (WebM Alpha)
          </label>
        </div>
      </div>

      <!-- Presets Toolbar -->
      <div class="field">
        <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Animacijos Presetas</label>
        <div class="flex" style="gap: 6px;">
          <select id="kineticPresetSelect" style="flex: 1; font-size: 12px;">
            <!-- Populated via JS -->
          </select>
          <button id="btnSaveKineticPreset" class="btn text-xs" title="Save naują presetą">💾</button>
          <button id="btnDeleteKineticPreset" class="btn bad text-xs icon" title="Delete pasirinktą presetą">🗑️</button>
        </div>
      </div>

      <div style="height: 1px; background: var(--border, #28283a); margin: 2px 0;"></div>

      <!-- Text Inputs & Case Transformer -->
      <div class="field">
        <div class="flex justify-between items-center mb-1">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--accent);">Pagrindinė Antraštė (Line 1 / Title)</label>
          <select id="kTextCaseSelect" style="font-size: 10px; width: 110px; padding: 2px 4px;">
            <option value="uppercase" selected>UPPERCASE</option>
            <option value="titlecase">Title Case</option>
            <option value="original">Original Case</option>
          </select>
        </div>
        <input type="text" id="kTextInput1" placeholder="Pvz.: BUSINESS 20:" style="font-size: 13px; font-weight: bold; color: var(--accent-secondary, #00ffcc);" />
      </div>
      <div class="field">
        <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Subtitras / Pavadinimas (Line 2 / Subtitle)</label>
        <input type="text" id="kTextInput2" placeholder="Pvz.: High-Rise & Commercial Window Cleaning" style="font-size: 13px;" />
      </div>

      <div style="height: 1px; background: var(--border, #28283a); margin: 2px 0;"></div>

      <!-- Effect & Typography Selectors -->
      <div class="field">
        <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Efektas</label>
        <select id="kEffectSelect" style="font-size: 12px; font-weight: 600;">
          <option value="wiggly_sketch">✏️ Chalk / Wiggly Sketch</option>
          <option value="stopmotion_sketch">🎬 Stopmotion Sketch</option>
          <option value="cia_intro">🕵️ CIA Top Secret Intro</option>
          <option value="vhs_glitch">📼 VHS Cassette Glitch</option>
          <option value="blueprint_sketch">📐 Architect Blueprint</option>
          <option value="synthwave_grid">🌆 Synthwave Cyber Grid</option>
          <option value="comic_pop">💥 Comic Book Pop</option>
          <option value="gold_sparkle">✨ Hollywood Gold Sparkle</option>
          <option value="slice_glitch">⚡ Slice RGB Distortion</option>
          <option value="vortex_hypnotic">🌀 Hypnotic Tunnel</option>
          <option value="kinetic_zoom">🔍 Kinetic Pulse Zoom</option>
          <option value="matrix">📟 Digital Matrix Drift</option>
          <option value="scary_shake">👻 Horror Movie Shake</option>
          <option value="hand_drawn">✍️ Hand Drawn Jitter</option>
          <option value="typewriter">⌨️ Rašomoji Mašinėlė</option>
          <option value="film_grain">🎞️ 35mm Vintage Film Grain</option>
          <option value="rgb_split">🌈 Chromatic Aberration</option>
          <option value="neon_glow">💡 Cyberpunk Neon Glow</option>
        </select>
      </div>

      <div class="grid-wf" style="grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="field">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Šriftas</label>
          <select id="kFontSelect" style="font-size: 12px;">
            <option value="'Permanent Marker', cursive">Permanent Marker</option>
            <option value="'Courier Prime', monospace">Courier Prime</option>
            <option value="'Impact', sans-serif">Impact</option>
            <option value="'Press Start 2P', monospace">Press Start 2P</option>
            <option value="'Rubik Mono One', sans-serif">Rubik Mono</option>
            <option value="'Caveat', cursive">Caveat</option>
            <option value="'Sacramento', cursive">Sacramento</option>
            <option value="'Inter', sans-serif">Inter Clean</option>
          </select>
        </div>
        <div class="field">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Lygiavimas & Storis</label>
          <div class="flex" style="gap: 4px;">
            <select id="kAlignSelect" style="font-size: 11px; flex: 1;">
              <option value="center" selected>Center</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
            <select id="kWeightSelect" style="font-size: 11px; flex: 1;">
              <option value="bold" selected>Bold</option>
              <option value="normal">Normal</option>
              <option value="900">Heavy</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Color Controls -->
      <div class="grid-wf" style="grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="field">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Teksto Spalva</label>
          <div class="flex items-center" style="gap: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px;">
            <input type="color" id="kTextColor" value="#ffffff" style="width: 28px; height: 28px; border: none; cursor: pointer; background: none;" />
            <span id="kTextColorVal" class="mono text-xs" style="color: var(--muted);">#ffffff</span>
          </div>
        </div>
        <div class="field">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Fono Spalva</label>
          <div class="flex items-center" style="gap: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px;">
            <input type="color" id="kBgColor" value="#000000" style="width: 28px; height: 28px; border: none; cursor: pointer; background: none;" />
            <span id="kBgColorVal" class="mono text-xs" style="color: var(--muted);">#000000</span>
          </div>
        </div>
      </div>

      <!-- Media Background & Entrance Transition -->
      <div style="background: rgba(168, 85, 247, 0.08); border: 1px solid rgba(168, 85, 247, 0.25); padding: 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px;">
        <div class="flex justify-between items-center">
          <label style="font-size: 11px; text-transform: uppercase; color: #c084fc; font-weight: 700;">🌄 Fono Medija (Foto / Video)</label>
          <button id="btnClearKineticMedia" class="btn text-xs bad" style="padding: 2px 6px; font-size: 10px;" title="Pašalinti fono mediją">✕ Išvalyti</button>
        </div>
        <div class="flex items-center" style="gap: 6px; flex-wrap: wrap;">
          <input type="file" id="kMediaUpload" accept="image/*,video/mp4,video/webm" style="display:none;" />
          <button id="btnUploadKineticMedia" type="button" class="btn text-xs flex-1" style="background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.4); color: #fff;">
            📁 Failas (.jpg, .mp4)
          </button>
          <button id="btnPickKineticMediaFromProject" type="button" class="btn text-xs flex-1" style="background: rgba(6, 182, 212, 0.2); border-color: rgba(6, 182, 212, 0.4); color: #00ffcc;" title="Pasirinkti iš jau sugeneruotų ar importuotų projekto vaizdų">
            🖼️ Iš Projekto
          </button>
          <button id="btnUseCurrentSceneImage" type="button" class="btn text-xs" style="background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.4); color: #86efac;" title="Naudoti šios scenos importuotą/sugeneruotą vaizdą">
            🎯 Šios Scenos
          </button>
        </div>
        <input type="text" id="kMediaUrlInput" placeholder="Arba URL / failo kelias (Pvz.: /vault/...)" style="font-size: 11px; padding: 4px 8px;" />
        
        <!-- Opacity & Blur Sliders -->
        <div class="grid-wf" style="grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px;">
          <div class="field" style="margin: 0;">
            <div class="flex justify-between items-center">
              <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);" title="Fono vaizdo permatomumas (persišviečia fono spalva)">Skaidrumas</label>
              <span id="kMediaOpacityVal" class="mono text-xs" style="color: #c084fc;">100%</span>
            </div>
            <input type="range" id="kMediaOpacityInput" min="0" max="100" step="5" value="100" />
          </div>
          <div class="field" style="margin: 0;">
            <div class="flex justify-between items-center">
              <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);" title="Fono vaizdo suliejimas">Suliejimas (Blur)</label>
              <span id="kMediaBlurVal" class="mono text-xs" style="color: #c084fc;">0px</span>
            </div>
            <input type="range" id="kMediaBlurInput" min="0" max="30" step="1" value="0" />
          </div>
        </div>

        <div class="flex justify-between items-center" style="margin-top: 2px;">
          <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);">Tamsinimas (Overlay Dim)</label>
          <span id="kMediaDimVal" class="mono text-xs" style="color: #c084fc;">40%</span>
        </div>
        <input type="range" id="kMediaDimInput" min="0" max="100" step="5" value="40" />

        <div class="field" style="margin-top: 4px; margin-bottom: 0;">
          <label style="font-size: 10px; text-transform: uppercase; color: #c084fc; font-weight: 700;">✨ Įėjimo Perėjimas (Entrance Transition)</label>
          <select id="kEntranceSelect" style="font-size: 11px; width: 100%;">
            <option value="fade_in" selected>Išblukimas (Fade In)</option>
            <option value="slide_up">Slidimas į viršų (Slide Up)</option>
            <option value="pop_zoom">Iššokimas (Pop / Zoom In)</option>
            <option value="none">Be perėjimo (Instant Cut)</option>
          </select>
        </div>
      </div>

      <!-- Size Hierarchy & Ratio Controls -->
      <div class="grid-wf" style="grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="field">
          <div class="flex justify-between items-center">
            <label style="font-size: 10px; text-transform: uppercase; color: var(--accent);">Antraštės Dydis (Line 1)</label>
            <span id="kSize1Val" class="mono text-xs" style="color: var(--accent-secondary, #00ffcc);">65px</span>
          </div>
          <input type="range" id="kSize1Input" min="20" max="160" value="65" />
        </div>
        <div class="field">
          <div class="flex justify-between items-center">
            <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);">Subtitro Dydis (Line 2)</label>
            <span id="kSize2Val" class="mono text-xs" style="color: var(--accent-secondary, #00ffcc);">44px</span>
          </div>
          <input type="range" id="kSize2Input" min="14" max="120" value="44" />
        </div>
      </div>

      <div class="field">
        <div class="flex justify-between items-center">
          <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);">Antraštės ir Subtitro Dydžio Santykis (Ratio)</label>
          <span id="kTitleRatioVal" class="mono text-xs" style="color: var(--accent-secondary, #00ffcc);">1.5x</span>
        </div>
        <input type="range" id="kTitleRatioInput" min="1.0" max="2.5" step="0.1" value="1.5" />
      </div>

      <div class="field">
        <div class="flex justify-between items-center">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Animacijos Greitis</label>
          <span id="kSpeedVal" class="mono text-xs" style="color: var(--accent-secondary, #00ffcc);">1.0x</span>
        </div>
        <input type="range" id="kSpeedInput" min="0.1" max="3.0" step="0.1" value="1.0" />
      </div>

      <div class="field">
        <div class="flex justify-between items-center">
          <label style="font-size: 11px; text-transform: uppercase; color: var(--muted);">Intensyvumas / Virpėjimas</label>
          <span id="kIntensityVal" class="mono text-xs" style="color: var(--accent-secondary, #00ffcc);">20px</span>
        </div>
        <input type="range" id="kIntensityInput" min="0" max="60" step="1" value="20" />
      </div>

      <div class="field">
        <div class="flex justify-between items-center">
          <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);">Tarpas Tarp Eilučių (Line Gap)</label>
          <span id="kLineGapVal" class="mono text-xs" style="color: var(--accent-secondary, #00ffcc);">45px</span>
        </div>
        <input type="range" id="kLineGapInput" min="20" max="120" value="45" />
      </div>

      <div class="grid-wf" style="grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="field">
          <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);">Trukmė (sek.)</label>
          <input type="number" id="kDurationInput" min="1" max="60" value="4" style="font-size: 12px;" />
        </div>
        <div class="field">
          <label style="font-size: 10px; text-transform: uppercase; color: var(--muted);">FPS</label>
          <select id="kFpsSelect" style="font-size: 12px;">
            <option value="24">24 FPS (Film)</option>
            <option value="30" selected>30 FPS (Standard)</option>
            <option value="60">60 FPS (Smooth)</option>
          </select>
        </div>
      </div>

    </div>

    <!-- RIGHT PANEL: WORKSTATION CANVAS & SCENES GRID -->
    <div class="flex-col" style="gap: 16px; height: 100%; overflow: hidden;">
      
      <!-- Preview Area -->
      <div class="panel flex-col items-center justify-center" style="flex: 1; min-height: 380px; position: relative; background: radial-gradient(circle at center, #141420 0%, #06060a 100%); padding: 16px; overflow: hidden; margin-bottom: 0;">
        
        <div class="canvas-container" style="position: relative; max-width: 100%; max-height: 100%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 0 1px var(--border);">
          <canvas id="kineticCanvas" width="1280" height="720" style="max-width: 100%; max-height: 48vh; background: #000; border-radius: 8px; object-fit: contain;"></canvas>
        </div>

        <div class="preview-controls" style="margin-top: 12px; display: flex; gap: 12px; align-items: center; background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 30px; border: 1px solid var(--border);">
          <button id="btnToggleKineticPlay" class="btn text-xs primary" style="border-radius: 20px; font-weight: bold;">⏸️ Pauzė</button>
          <button id="btnToggleKineticSceneMode" class="btn text-xs accent" style="border-radius: 20px; font-weight: bold; background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.4);" title="Perjungti: Tekstas + Fonas <-> Tik Vaizdas">
            🎬 Tekstas + Fonas
          </button>
          <span id="kineticPreviewStatus" class="mono text-xs text-muted" style="font-weight: 600;">Aktyvi Scene #S23</span>
          <div style="width: 1px; height: 16px; background: var(--border);"></div>
          <button id="btnExportActiveSceneVideo" class="btn text-xs good" style="border-radius: 20px;" title="Download aktyvios scenos video (.webm)">
            📥 Eksportuoti Video (.webm)
          </button>
        </div>

      </div>

      <!-- Scenes Carousel / Timeline Grid -->
      <div class="panel flex-col" style="height: 220px; margin-bottom: 0; padding: 12px;">
        <div class="panel-h justify-between items-center" style="margin-bottom: 8px;">
          <div class="flex items-center" style="gap: 8px;">
            <span>📋 Kinetic Antraščių Scenos (<span id="kineticSceneCountBadge">0 scenos</span>)</span>
            <input type="text" id="kSceneSearchInput" placeholder="🔍 Paieška pagal ID (S23, S42) / tekstą..." style="font-size: 11px; padding: 4px 8px; width: 220px; margin-left: 10px;" />
          </div>
          <div class="flex items-center" style="gap: 6px;">
            <button id="btnAddKineticScene" class="btn text-xs primary">+ Pridėti Sceną</button>
            <button id="btnBatchExportVideos" class="btn text-xs good">📦 Render Visas Scenes (.zip)</button>
          </div>
        </div>

        <div id="kineticScenesGrid" style="flex: 1; display: flex; gap: 12px; overflow-x: auto; padding: 6px 2px; align-items: center;">
          <!-- Scene cards injected via JS -->
        </div>
      </div>

    </div>

  </div>

</div>
